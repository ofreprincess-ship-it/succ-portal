<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Results Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>🎓 STUDENT RESULTS PORTAL</h1>
            <p>Student Registration and Result Portal</p>
        </header>

        <form>

            <h2>Student Information</h2>

            <!-- First Name -->
            <div>
                <label>First Name <span>*</span></label>
                <input type="text"
                       placeholder="Enter first name"
                       required>
            </div>

            <!-- Middle Name -->
            <div>
                <label>Middle Name</label>
                <input type="text"
                       placeholder="Enter middle name">
            </div>

            <!-- Last Name -->
            <div>
                <label>Last Name <span>*</span></label>
                <input type="text"
                       placeholder="Enter last name"
                       required>
            </div>

            <!-- Registration Number -->
            <div>
                <label>Registration Number <span>*</span></label>
                <input type="text"
                       placeholder="Enter registration number"
                       required>
            </div>

            <!-- Email -->
            <div>
                <label>Email Address <span>*</span></label>
                <input type="email"
                       placeholder="example@gmail.com"
                       required>
            </div>

            <!-- Phone -->
            <div>
                <label>Phone Number <span>*</span></label>
                <input type="tel"
                       placeholder="Enter phone number"
                       required>
            </div>
      
            <!-- Submit -->
            <button type="submit">
                SUBMIT INFORMATION
            </button>

        </form>


        <!-- RESULTS TABLE -->

        <h2 class="result-title">📋 Student Results</h2>

        <table>

            <tr>
                <th>S/N</th>
                <th>Student Name</th>
                <th>Reg. Number</th>
            </tr>

            <tr>
                <td>1</td>
                <td>ofre princess</td>
                <td>202440564405DA</td>
            </tr>
        </table>

    </div>

</body>
</html>
